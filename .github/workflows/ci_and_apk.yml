name: pennyFlip Android APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: Get Flutter packages
        run: flutter pub get
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Build Debug APK
        run: |
          flutter create . --platforms=android --org com.pennyflip.sniper
          flutter build apk --debug
      - name: Upload pennyFlip APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pennyflip-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
